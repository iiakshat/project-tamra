; Android export presets. No secrets here: Godot keeps keystore passwords in
; .godot/export_credentials.cfg (git-ignored), and CI passes them as env vars.
; package/unique_name is a PLACEHOLDER. Change it before the first Play upload;
; it can never change after that.

[preset.0]

name="Android Debug"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="config/*.json, assets/licenses/*.txt"
exclude_filter="tests/*, tools/*, docs/*, *.md"
export_path="build/project-tamra-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

launcher_icons/adaptive_background_432x432="res://assets/icon/adaptive_bg.png"

launcher_icons/adaptive_foreground_432x432="res://assets/icon/adaptive_fg.png"

launcher_icons/main_192x192="res://assets/icon/icon_192.png"

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=5
version/name="0.5.0"
package/unique_name="com.iiakshat.projecttamra"
package/name="Tamra"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
permissions/internet=false
permissions/vibrate=true
